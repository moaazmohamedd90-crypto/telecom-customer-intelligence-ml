<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NileConnect – Customer Intelligence</title>
<style>
:root{--bg:#061424;--tx:#f4f6fb;--mu:#9fb0c4;--cd:#12263d;--tl:#22cfcf;--gd:#ffc966;--rd:#ff7b7b;--pu:#8a7fd6;--bl:#3f87d4;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:"Noto Sans","Segoe UI",system-ui,Arial,sans-serif;color:var(--tx)}
#st{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.s{position:absolute;inset:0;display:none;flex-direction:column;padding:26px 72px 22px}
.s.on{display:flex}
.hd{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.28em;color:var(--mu);border-bottom:1px solid #16304a;padding-bottom:10px}
.hd b{color:var(--tl)}
h2{font-size:46px;margin-top:26px;line-height:1.1}
.sub{color:var(--mu);font-size:20px;margin-top:10px}
.body{flex:1;margin-top:26px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.ft{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;color:var(--mu);border-top:1px solid #16304a;padding-top:10px}
.ft b{color:var(--tl)}
.a{opacity:0}.on .a{animation:up .7s var(--d,0s) both cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.g{display:grid;gap:22px}
.c{background:var(--cd);border-radius:16px;padding:22px 24px;border:1px solid #1b3550}
.c h4{font-size:15px;letter-spacing:.14em;color:var(--tl);margin-bottom:8px}
.c p,.m{color:var(--mu);font-size:17px;line-height:1.4}
.big{font-size:60px;font-weight:800;line-height:1}
.k{color:var(--tl);font-size:13px;letter-spacing:.2em;font-weight:700}
.note{background:#0d2036;border-radius:12px;padding:14px 20px;color:var(--mu);font-size:17px}
.note b{color:var(--gd)}
.br{display:grid;grid-template-columns:230px 1fr 110px;align-items:center;gap:16px;font-size:18px}
.br .l{text-align:right}.br .v{font-weight:700;font-size:22px}
.bar{height:20px;background:#12263d;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:10px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.on .bar i{width:var(--w);transition-delay:calc(var(--d,0s) + .3s)}
.rw{display:flex;flex-direction:column;align-items:center;gap:8px}.rw small{color:var(--mu);letter-spacing:.14em;font-size:13px;font-weight:700}
.rg{position:relative;width:190px;height:190px}
.rg svg{width:100%;height:100%;fill:none;stroke-width:9}
.rg .t{stroke:#1b3550}.rg .f{stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1) .4s}
.on .rg .f{stroke-dashoffset:calc(100 - var(--p))}
.rg .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800}
.row{display:flex;gap:26px;align-items:center;justify-content:center}
.stp{text-align:center}
.stp .o{width:60px;height:60px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px}
.stp h4{font-size:19px;color:var(--tx);letter-spacing:.02em}
.ar{color:var(--tl);font-size:34px;animation:pl 1.2s infinite alternate}
@keyframes pl{from{opacity:.3;transform:translateX(-4px)}to{opacity:1;transform:translateX(5px)}}
.ck{list-style:none;color:var(--mu);font-size:19px;line-height:2}
.ck li::before{content:"✓";color:var(--tl);font-weight:800;margin-right:12px}
.t1 .tl{margin:96px 0 0}.t1 h1{font-size:96px;line-height:1.08;letter-spacing:.01em;margin-top:18px}
.t1 h3{color:var(--gd);font-size:38px;margin-top:40px}.t1 .m{margin-top:34px;font-size:22px}
.t1 canvas{position:absolute;right:20px;top:90px;width:560px;height:560px}
.t1 .ft{position:absolute;left:72px;right:72px;bottom:22px;color:var(--tx);font-weight:700;letter-spacing:.2em}
.sb{position:absolute;left:0;top:0;bottom:0;width:16px;background:var(--tl)}
.k5{display:flex;gap:18px;align-items:flex-end;height:180px}
.k5 div{width:62px;border-radius:10px 10px 0 0;background:#1b3550;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;color:var(--mu);font-weight:700;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1) calc(var(--d,0s) + .3s)}
.on .k5 div{height:var(--h)}.k5 .hi{background:var(--tl);color:#061424;animation:glow 1.6s infinite alternate 1.4s}
@keyframes glow{to{box-shadow:0 0 28px var(--tl)}}
.spin{animation:sp var(--s) linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes sp{to{transform:rotate(360deg)}}
.ctl{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:9}
.ctl button{background:#12263dcc;color:var(--tx);border:1px solid #1b3550;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer}
#pg{position:fixed;left:0;bottom:0;height:4px;background:var(--tl);transition:width .4s;z-index:9}
@media (prefers-reduced-motion:reduce){.a{opacity:1!important;animation:none!important}.ar,.spin,.k5 .hi{animation:none}}
</style></head><body>
<div id="st"></div><div id="pg"></div>
<div class="ctl"><button id="pv" aria-label="Previous">‹</button><button id="nx" aria-label="Next">›</button></div>
<script>
const N=20,L=[];
const n=(v,d=0,s='')=>`<b class="n" data-to="${v}" data-d="${d}" data-s="${s}">0${s}</b>`;
const bars=(it,mx,fs)=>it.map(([l,v,d,s,c])=>`<div class="br a"><span class="l">${l}</span><div class="bar"><i style="--w:${v/mx*100}%;background:${c||'var(--tl)'}"></i></div><span class="v">${n(v,d,s)}</span></div>`).join('');
const ring=(p,v,d,s,lab,c)=>`<div class="rw a"><div class="rg"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="f" cx="60" cy="60" r="52" pathLength="100" style="--p:${p};stroke:${c||'var(--tl)'}" transform="rotate(-90 60 60)"/></svg><div class="v">${n(v,d,s)}</div></div><small>${lab}</small></div>`;
const card=(h,p,x='')=>`<div class="c a" ${x}><h4>${h}</h4><p>${p}</p></div>`;
const sl=(k,t,s,b)=>{const i=L.length+1;L.push(`<section class="s"><div class="hd"><b>N I L E &nbsp; C O N N E C T</b><span>${k}</span></div><h2 class="a">${t}</h2><p class="sub a">${s}</p><div class="body">${b}</div><div class="ft"><span>ML CAPSTONE • CUSTOMER INTELLIGENCE</span><b>${String(i).padStart(2,'0')} / 20</b></div></section>`)};
const note=t=>`<div class="note a">${t}</div>`;

L.push(`<section class="s t1"><i class="sb"></i><div class="tl" style="padding-left:6px"><p class="k a">MACHINE LEARNING CAPSTONE</p><h1 class="a">NILE<br>CONNECT</h1><h3 class="a">Customer Intelligence</h3><p class="m a">Predict churn. Understand bills.<br>Discover segments. Design smarter bundles.</p></div><canvas id="cv" width="560" height="560"></canvas><div class="ft"><span>DATA • MACHINE LEARNING • BUSINESS IMPACT</span><b>01 / 20</b></div></section>`);

sl('THE PROBLEM','Four business questions','The project translates telecom data into decisions the CEO can act on.',
`<div class="g" style="grid-template-columns:repeat(4,1fr)">${card('01 CHURN','Which customers are likely to leave?')+card('02 BILLING','What drives the monthly bill?')+card('03 SEGMENTS','Who are our different customer groups?')+card('04 BUNDLES','Which services are purchased together?')}</div>${note('One goal: make analytics <b>explainable, actionable, and commercially testable</b>.')}`);

const stp=(o,c,h,p)=>`<div class="c stp a" style="width:200px"><div class="o" style="background:${c}">${o}</div><h4>${h}</h4><p class="m" style="margin-top:10px;font-size:15px">${p}</p></div>`;
sl('WORKFLOW','The analytical pipeline','From messy data to validated insights and business recommendations.',
`<div class="row">${[['01','#22a0a8','AUDIT','Clean + explore'],['02','#3f87d4','PREDICT','Regression + churn'],['03','#bb9c58','DISCOVER','Clustering + PCA'],['04','#8a7fd6','ASSOCIATE','Apriori rules'],['05','#c06868','ACT','CEO recommendations']].map((x,i)=>stp(...x)+(i<4?'<span class="ar">›</span>':'')).join('')}</div>${note('Reproducibility: Python • pandas • scikit-learn • XGBoost • mlxtend • random_state = 42.')}`);

const big=(v,d,s,h,p,c)=>`<div class="c a"><div class="big" style="color:${c||'var(--tx)'}">${n(v,d,s)}</div><h4 style="margin-top:14px">${h}</h4><p>${p}</p></div>`;
sl('THE DATA','Three datasets. One customer story.','Different tables answer different business questions.',
`<div class="g" style="grid-template-columns:repeat(3,1fr)">${big(3015,0,'','RAW CUSTOMER ROWS','18 columns • churn + billing','var(--tl)')+big(2000,0,'','USAGE BEHAVIOR ROWS','12 behavioral input features','var(--gd)')+big(4500,0,'','TRANSACTIONS / BASKETS','12,993 service entries • 13 services','var(--pu)')}</div>${note('<b>HOW THEY CONNECT</b> &nbsp; customer_id → Behavioral segments for 2,000 matched customers')}`);

sl('DATA QUALITY','Reliable models start with reliable data','Inspecting missing values, duplicates, outliers, and inconsistent categories.',
`<div class="g" style="grid-template-columns:1.6fr 1fr;align-items:center"><div class="g" style="grid-template-columns:repeat(3,1fr)">${big(15,0,'','DUPLICATES','Customer records removed','var(--rd)')+big(25,0,'','MISSING','Social-media usage entries','var(--gd)')+card('PIPELINES','Training-only imputation, scaling, and encoding')}</div><div class="c a"><h4>QUALITY CHECKLIST</h4><ul class="ck"><li>Inspect distributions</li><li>Review extreme values</li><li>Encode categories</li><li>Prevent data leakage</li></ul></div></div>${note('EDA included churn by contract, churn by tenure, and numeric correlations.')}`);

sl('BILLING / REGRESSION','Better bill prediction with more context','Multiple regression captured much more variation than data usage alone.',
`<div class="g" style="grid-template-columns:1.5fr 1fr;align-items:center"><div class="c a" style="padding:28px"><h4>TEST-SET R²</h4><div style="display:grid;gap:22px;margin-top:18px">${bars([['Simple Linear',.5,2,'','var(--bl)'],['Multiple Linear',.93,2,'','var(--tl)']],1,1)}</div></div><div style="display:grid;gap:18px">${ring(93.17,93.17,2,'%','R² = 0.9317 • EXPLAINED VARIATION')}<div class="c a"><div class="big" style="font-size:44px;color:var(--gd)">${n(36.38,2,' EGP')}</div><p style="margin-top:6px">MAE • average absolute error</p></div></div></div>${note('Model choice: <b>Multiple Linear Regression</b> for candidate bill estimation.')}`);

sl('BILLING / IMPACT','What the error metrics mean','Lower error makes bill estimates more useful—but not a replacement for invoices.',
`<div class="g" style="grid-template-columns:repeat(3,1fr)">${big(.9317,4,'','R²','Explains how much observed variation is captured.','var(--tl)')+big(36.38,2,' EGP','MAE','Typical absolute prediction miss in currency.','var(--gd)')+big(48.63,2,' EGP','RMSE','Penalizes larger prediction misses more heavily.','var(--pu)')}</div>${note('<b>BUSINESS USE</b> &nbsp; Validate billing estimates and monitor errors by plan, contract and bill size. →')}`);

sl('CHURN / CONTEXT','The customer retention challenge','Churn is a business problem—not just a classification exercise.',
`<div class="g" style="grid-template-columns:260px 1fr 1fr;align-items:center">${ring(25.97,25.97,2,'%','CHURN IN CLEANED DATA','var(--rd)')+card('FALSE NEGATIVE','A likely leaver missed by the model: potential lost customer.')+card('FALSE POSITIVE','A retained customer offered an unnecessary incentive.')}</div>${note('Class imbalance matters: predicting “no churn” for everyone can yield <b>misleading accuracy</b>.')}`);

sl('CHURN / BENCHMARK','Seven classification models compared','Five-fold cross-validation F1 on training data; higher is better.',
`<div style="display:grid;gap:12px">${bars([['Logistic Regression',.72,2,'','var(--gd)'],['XGBoost',.69,2],['SVM',.68,2],['Random Forest',.67,2],['Naive Bayes',.66,2],['KNN',.6,2],['Decision Tree',.59,2]],.8)}</div>${note('<b>WINNER • LOGISTIC REGRESSION:</b> best mean F1 and strong business-cost performance')}`);

sl('CHURN / COST','From classification errors to money','Illustrative training-set cost scenario—not measured financial savings.',
`<div class="g" style="grid-template-columns:1.7fr 1fr;align-items:center"><div class="c a" style="padding:26px"><h4>ESTIMATED SCENARIO COST / EGP</h4><div style="display:grid;gap:18px;margin-top:16px">${bars([['Logistic Regression',416800,0,'','var(--gd)'],['XGBoost',439500,0,'','var(--bl)'],['SVM',470600,0,'','var(--pu)']],500000)}</div></div><div style="display:grid;gap:16px"><div class="c a"><h4>ASSUMPTIONS</h4><div class="big" style="font-size:38px">${n(1500,0,' EGP')}</div><p>per missed churner</p></div><div class="c a"><div class="big" style="font-size:38px">${n(200,0,' EGP')}</div><p>per retention offer</p></div></div></div>${note('Offer effectiveness and realized savings must be validated in a controlled trial.')}`);

sl('MODEL SELECTION','Tuning was rigorous. Selection stayed honest.','GridSearchCV and RandomizedSearchCV improved alternatives, but not past Logistic Regression.',
`<div class="g" style="grid-template-columns:1fr 1fr">${[['GRID SEARCH • Decision Tree','36 parameter combinations • 5-fold CV',.66,.5916,'var(--bl)'],['RANDOM SEARCH • Random Forest','30 sampled combinations • 5-fold CV',.69,.6736,'var(--pu)']].map(([h,p,b,a,c])=>`<div class="c a"><h4>${h}</h4><p>${p}</p><div style="display:grid;gap:12px;margin-top:18px">${bars([['Best F1',b,4,'',c],['Baseline F1',a,4,'','#4b6a88']],.8).replace(/230px/g,'100px')}</div></div>`).join('')}</div>${note('<b>FINAL SELECTION</b> &nbsp; Logistic Regression • CV F1 '+n(.7175,4)+'')}`);

sl('CHURN / FINAL','Held-out test performance','One final evaluation on the untouched test set.',
`<div class="row" style="gap:40px">${ring(85.17,85.17,2,'%','ACCURACY','var(--tl)')+ring(74.81,74.81,2,'%','PRECISION','var(--bl)')+ring(64.74,64.74,2,'%','RECALL','var(--gd)')+ring(69.42,69.42,2,'%','F1 SCORE','var(--pu)')}</div>${note('Interpretation: roughly <b>65% of actual churners</b> were identified at the tested threshold.')}`);

sl('SEGMENTATION / METHOD','Five behavioral customer segments','KMeans on 12 standardized usage variables; k = 5 balanced quality and interpretability.',
`<div class="g" style="grid-template-columns:1.6fr 1fr;align-items:center"><div class="c a"><h4>SILHOUETTE SCORE BY K</h4><div class="k5" style="margin-top:20px">${[2,3,4,5,6,7,8].map((k,i)=>`<div class="${k==5?'hi':''}" style="--h:${k==5?170:60+((i*37)%50)}px;--d:${i*.08}s">${k}</div>`).join('')}</div></div><div style="display:grid;gap:18px"><div class="c a"><div class="big" style="color:var(--tl)">${n(.5534,4)}</div><p style="margin-top:8px">k = 5 • chosen for interpretable groups</p></div><div class="c a"><div class="big" style="color:var(--gd)">${n(12)}</div><p style="margin-top:8px">scaled behavioral features</p></div></div></div>`);

sl('SEGMENTATION / PROFILES','Five customers. Five different needs.','Behavioral segmentation supports personalized offers.',
`<div style="display:grid;gap:12px">${[['Digital Entertainment',525,'var(--tl)','Streaming + gaming'],['Light Usage',454,'var(--bl)','Affordable basic plans'],['Social Media',565,'var(--pu)','Social-centric data packs'],['International & Voice',418,'var(--gd)','Calling + roaming'],['Extreme Night & Data',38,'var(--rd)','High-volume night data']].map(([l,v,c,d],i)=>bars([[l+'<br><small style="color:var(--mu);font-size:13px">'+d+'</small>',v,0,'',c]],565)).join('')}</div>${note('Total: <b>2,000 customers</b> • Segment 4 represents only 1.9% of the observed sample.')}`);

sl('SEGMENT CHURN','Churn risk differs across segments','Descriptive comparisons: segment rates are not proof of causal effects.',
`<div style="display:grid;gap:14px">${bars([['Entertainment',26.29,2,'%','var(--tl)'],['Light Usage',24.23,2,'%','var(--bl)'],['Social Media',26.55,2,'%','var(--pu)'],['International & Voice',22.73,2,'%','var(--gd)'],['Extreme Night & Data',36.84,2,'%','var(--rd)']],40)}</div>${note('<b>36.84% HIGH-RISK SIGNAL</b> • only 14 of 38 customers churned; interpret cautiously')}`);

sl('UNSUPERVISED COMPARISON','KMeans, HAC, DBSCAN & PCA','Multiple methods tested cluster stability and dimensionality reduction.',
`<div class="g" style="grid-template-columns:1fr 1fr 1fr 1fr;align-items:stretch">${card('KMEANS • k=5','Silhouette <b style="color:var(--tl)">'+n(.5534,4)+'</b> • chosen segmentation')+card('HIERARCHICAL • WARD','Silhouette <b style="color:var(--bl)">'+n(.5536,4)+'</b> • similar grouping quality')+card('DBSCAN • eps=1.5','<b style="color:var(--gd)">'+n(4)+'</b> clusters + <b style="color:var(--rd)">'+n(41)+'</b> noise points')+`<div class="c a" style="text-align:center"><h4>PCA • 5 COMPONENTS</h4><div style="display:flex;justify-content:center">${ring(92.42,92.42,2,'%','VARIANCE PRESERVED','var(--pu)').replace('class="rw a"','class="rw" style="transform:scale(.7);margin:-20px 0"')}</div></div>`}</div>${note('Original-space silhouette after PCA clustering: 0.5534 — no meaningful improvement observed.')}`);

sl('INTEGRATION / HONEST RESULT','Does segment information improve churn F1?','Five-fold comparison on matched training customers; KMeans trained inside each fold.',
`<div class="g" style="grid-template-columns:1.6fr 1fr;align-items:center"><div class="c a" style="padding:26px"><h4>MEAN CROSS-VALIDATION F1</h4><div style="display:grid;gap:20px;margin-top:16px">${bars([['Baseline Logistic Regression',.73,2,'','var(--tl)'],['Logistic + Cluster Feature',.72,2,'','var(--bl)']],.8)}</div></div><div class="c a" style="text-align:center"><div class="big" style="color:var(--rd)">${n(-.0088,4)}</div><p style="margin-top:8px">F1</p></div></div>${note('Recommendation: keep cluster labels for <b>marketing insight</b>, not as an added churn predictor.')}`);

sl('APRIORI / PATTERNS','Which services belong together?','Apriori mined transactions using min support 3% and rule confidence ≥ 50%.',
`<div class="g" style="grid-template-columns:1fr 1.7fr;align-items:center"><div style="display:grid;gap:16px"><div class="c a"><div class="big" style="color:var(--tl)">${n(109)}</div><h4 style="margin-top:10px">FREQUENT ITEMSETS</h4><p>13 singles • 46 pairs • 40 triples • 10 groups of four</p></div><div class="c a"><div class="big" style="font-size:44px;color:var(--gd)">${n(30.11,2,'%')}</div><p style="margin-top:6px">Home Internet + Router Upgrade co-occurrence</p></div></div><div class="c a" style="padding:24px"><h4>TOP FIVE SERVICES BY SUPPORT</h4><div style="display:grid;gap:14px;margin-top:14px">${bars([['Mobile Data Pack',51.96,2,'%','var(--tl)'],['Home Internet',38.64,2,'%','var(--bl)'],['Router Upgrade',32.36,2,'%','var(--pu)'],['Extra Minutes',32.36,2,'%','var(--gd)'],['Streaming Bundle',26.93,2,'%','var(--rd)']],55).replace(/230px/g,'160px').replace(/110px/g,'90px')}</div></div></div>`);

sl('CROSS-SELL OPPORTUNITIES','Three targeted bundle experiments','Association strength suggests tests—not guaranteed sales lift.',
`<div class="g" style="grid-template-columns:repeat(3,1fr)">${[['HOME CONNECTIVITY','Home Internet + Router Upgrade',n(30.11,2,'%')+' of transactions contain both','Offer router upgrade to home internet users','var(--tl)'],['INTERNATIONAL TRAVELER','Intl Calling + Roaming Pack',n(92.17,2,'%')+' confidence • lift '+n(8.96,2),'Test travel-ready calling + roaming pack','var(--gd)'],['DEVICE PROTECTION','Device Installment + Antivirus',n(83.67,2,'%')+' confidence • lift '+n(5.97,2),'Offer protection with device financing','var(--pu)']].map(([h,t,s,p,c])=>`<div class="c a"><h4 style="color:${c}">${h}</h4><div style="font-size:24px;font-weight:700;margin:8px 0 14px">${t}</div><p style="color:var(--tx)">${s}</p><p style="margin-top:14px">${p}</p></div>`).join('')}</div>`);

L.push(`<section class="s"><div class="hd"><b>FINAL TAKEAWAY</b><span></span></div><div style="display:flex;flex:1;align-items:center;gap:40px"><div style="flex:1"><h2 class="a" style="font-size:70px;margin:0">From insight<br>to impact.</h2><div style="display:grid;gap:18px;margin-top:40px">${[['01','PILOT RETENTION','Measure real saves and offer costs'],['02','VALIDATE BILLING','Monitor MAE / RMSE by plan'],['03','TEST BUNDLES','A/B test uptake and contribution margin'],['04','MONITOR MODELS','Watch data quality, drift and small segments']].map(([a,b,c])=>`<div class="a" style="display:flex;gap:24px;font-size:19px"><b style="color:var(--tl)">${a}</b><b style="width:190px">${b}</b><span style="color:var(--mu)">${c}</span></div>`).join('')}</div></div><svg class="a" viewBox="-170 -170 340 340" style="width:380px;fill:none;stroke-width:7;stroke-linecap:round"><circle class="spin" r="150" pathLength="100" stroke-dasharray="70 30" style="stroke:var(--tl);--s:16s"/><circle class="spin" r="118" pathLength="100" stroke-dasharray="60 40" style="stroke:var(--gd);--s:11s;animation-direction:reverse"/><circle class="spin" r="86" pathLength="100" stroke-dasharray="55 45" style="stroke:var(--rd);--s:8s"/><circle class="spin" r="58" pathLength="100" stroke-dasharray="40 60" stroke-width="3" style="stroke:#fff;--s:5s;animation-direction:reverse"/><circle r="22" style="fill:var(--tl);stroke:none" class="spin"/></svg></div><div class="ft"><b style="color:var(--gd);letter-spacing:.3em">THANK YOU • QUESTIONS?</b><b>20 / 20</b></div></section>`);

const st=document.getElementById('st');st.innerHTML=L.join('');
const S=[...st.children];
S.forEach(s=>s.querySelectorAll('.a').forEach((e,i)=>e.style.setProperty('--d',(i*.11)+'s')));
const fmt=(v,d)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).replace('-','−');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let cur=-1,T=0;
function run(s){const tok=++T;s.querySelectorAll('.n').forEach(e=>{const to=+e.dataset.to,d=+e.dataset.d,sf=e.dataset.s||'';if(RM){e.textContent=fmt(to,d)+sf;return}e.textContent=fmt(0,d)+sf;const t=performance.now()+400;const f=x=>{if(tok!=T)return;const p=Math.min(1,Math.max(0,(x-t)/1600)),v=to*(1-Math.pow(1-p,3));e.textContent=fmt(v,d)+sf;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function go(i){i=Math.max(0,Math.min(N-1,i));if(i==cur)return;cur=i;S.forEach((s,j)=>s.classList.toggle('on',j==i));run(S[i]);document.getElementById('pg').style.width=((i+1)/N*100)+'%';try{history.replaceState(null,'','#s'+(i+1))}catch(e){}}
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`translate(${-640*k}px,${-360*k}px) scale(${k})`}
addEventListener('resize',fit);fit();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}else if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1);else if(e.key=='Home')go(0);else if(e.key=='End')go(N-1)});
document.getElementById('nx').onclick=()=>go(cur+1);document.getElementById('pv').onclick=()=>go(cur-1);
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX);addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1));x0=null});
addEventListener('hashchange',()=>{const m=/^#s(\d+)$/.exec(location.hash);if(m)go(+m[1]-1)});
const m0=/^#s(\d+)$/.exec(location.hash);go(m0?+m0[1]-1:0);
// title-slide network
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),P=[];
for(let i=0;i<30;i++)P.push({x:Math.random()*560,y:Math.random()*560,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:2+Math.random()*4,g:Math.random()<.12});
(function d(){cx.clearRect(0,0,560,560);if(cur==0&&!RM||cur==0&&!d.o){d.o=1;
P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<10||p.x>550)p.vx*=-1;if(p.y<10||p.y>550)p.vy*=-1});
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],dd=Math.hypot(a.x-b.x,a.y-b.y);if(dd<130){cx.strokeStyle=`rgba(34,207,207,${.5*(1-dd/130)})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
P.forEach(p=>{const c=p.g?'255,201,102':'34,207,207',g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);g.addColorStop(0,`rgba(${c},.5)`);g.addColorStop(1,`rgba(${c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r*6,0,7);cx.fill();cx.fillStyle=`rgb(${c})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()})}
requestAnimationFrame(d)})();
</script></body></html>
